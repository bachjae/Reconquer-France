name: reconquer_france
description: Geo-gamified photobook and social travel app for France exploration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  flutter_map_tile_caching: ^9.1.0
  geolocator: ^12.0.0
  connectivity_plus: ^6.0.0

  # Photos & Camera
  photo_manager: ^3.3.0
  exif: ^3.3.0
  image: ^4.2.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0

  # State & Storage
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.5
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI
  google_fonts: ^6.2.0
  flutter_speed_dial: ^7.0.0
  share_plus: ^10.0.0
  go_router: ^14.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.0
  flutter_local_notifications: ^17.0.0
  smooth_page_indicator: ^1.1.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.10+1
  camera: ^0.10.5+9
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
